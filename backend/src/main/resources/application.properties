spring.application.name=portfolio-api

# Lê as chaves do arquivo backend/.env, se ele existir (o .env não vai para o GitHub).
# No Render as mesmas variáveis são cadastradas no painel.
spring.config.import=optional:file:.env[.properties]

# Porta: o Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}

# --- Formulário de contato ---
# E-mail que recebe as mensagens do site
contact.receiver=${CONTACT_RECEIVER:jpaulo.rodrigues04@gmail.com}
# Remetente usado pelo Resend. Sem domínio verificado, use onboarding@resend.dev
contact.from=${CONTACT_FROM:Portfolio jprodrigues.me <onboarding@resend.dev>}
# Envia uma confirmação para quem preencheu o formulário
# (com Resend, só funciona quando o remetente é de um domínio verificado)
contact.send-confirmation=${CONTACT_SEND_CONFIRMATION:true}
# Sites que podem chamar a API (CORS), separados por vírgula
contact.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://jprodrigues.me,https://www.jprodrigues.me}
# Limite por visitante: no máximo 5 mensagens a cada 10 minutos
contact.max-per-window=5
contact.window=10m
# Limite geral por dia, abaixo das cotas gratuitas do Gmail e do Resend
contact.daily-limit=80

# --- Opção 1: Resend (API de e-mail por HTTPS) -> usada no Render ---
# Quando RESEND_API_KEY está preenchida, ela tem prioridade.
resend.api-key=${RESEND_API_KEY:}
resend.base-url=https://api.resend.com

# --- Opção 2: Gmail por SMTP (mesmo esquema do projeto SendEmail da disciplina) ---
# Funciona no seu computador. No plano gratuito do Render as portas SMTP são bloqueadas.
# A senha é uma "Senha de app" do Google: https://myaccount.google.com/apppasswords
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=${GMAIL_USERNAME:}
smtp.password=${GMAIL_APP_PASSWORD:}
