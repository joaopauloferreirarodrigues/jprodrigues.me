spring.application.name=portfolio-api

# Porta: o Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}

# --- Formulário de contato ---
# E-mail que recebe as mensagens do site
contact.receiver=${CONTACT_RECEIVER:jpaulo.rodrigues04@gmail.com}
# Remetente usado pelo Resend. Sem domínio verificado, use onboarding@resend.dev
contact.from=${CONTACT_FROM:Portfolio jprodrigues.me <onboarding@resend.dev>}
# Envia uma confirmação para quem preencheu o formulário (exige domínio verificado no Resend)
contact.send-confirmation=${CONTACT_SEND_CONFIRMATION:false}
# Sites que podem chamar a API (CORS), separados por vírgula
contact.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,https://jprodrigues.me,https://www.jprodrigues.me}
# Limite por visitante: no máximo 5 mensagens a cada 10 minutos
contact.max-per-window=5
contact.window=10m
# Limite geral por dia, abaixo da cota gratuita do Resend
contact.daily-limit=80

# --- Resend (API de e-mail por HTTPS) ---
resend.api-key=${RESEND_API_KEY:}
resend.base-url=https://api.resend.com
